<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Change</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background:white;
            width:420px;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        .password-wrapper{
            position:relative;
        }

        .password-wrapper input{
            width:100%;
            padding:12px;
            padding-right:50px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
        }

        .password-wrapper input:focus{
            border-color:#007bff;
        }

        .toggle-password{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:18px;
            user-select:none;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
            transition:.3s;
        }

        button:hover{
            background:#0056b3;
        }

        .success{
            color:green;
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        }

        .error{
            color:red;
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        }

        .loader{
            display:none;
            text-align:center;
            margin-top:15px;
            color:#007bff;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Reset Password</h2>

    <form id="resetPasswordForm">

        {% csrf_token %}

        <input
            type="hidden"
            id="user_id"
            value="{{ user_id }}"
        >

        <input
            type="hidden"
            id="token"
            value="{{ token }}"
        >

        <div class="form-group">
            <label>New Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="new_password"
                    placeholder="Enter New Password"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword('new_password', this)"
                >
                    👁
                </span>
            </div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="confirm_password"
                    placeholder="Confirm Password"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword('confirm_password', this)"
                >
                    👁
                </span>
            </div>
        </div>

        <button type="submit" id="submitBtn">
            Change Password
        </button>

    </form>

    <div class="loader" id="loader">
        Processing...
    </div>

    <div id="message"></div>

</div>

<script>

function togglePassword(inputId, icon){

    const input =
        document.getElementById(inputId);

    if(input.type === "password"){
        input.type = "text";
        icon.innerHTML = "🙈";
    }
    else{
        input.type = "password";
        icon.innerHTML = "👁";
    }
}

document
.getElementById("resetPasswordForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const loader =
        document.getElementById("loader");

    const submitBtn =
        document.getElementById("submitBtn");

    const messageDiv =
        document.getElementById("message");

    messageDiv.innerHTML = "";

    loader.style.display = "block";

    submitBtn.disabled = true;

    try{

        const response = await fetch(
            "http://localhost:8000/api/users/password-change/",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    user_id:
                        document.getElementById("user_id").value,

                    token:
                        document.getElementById("token").value,

                    new_password:
                        document.getElementById("new_password").value,

                    confirm_password:
                        document.getElementById("confirm_password").value
                })
            }
        );

        const data =
            await response.json();

        loader.style.display = "none";

        submitBtn.disabled = false;

        if(response.ok){

            messageDiv.innerHTML =
                `<p class="success">
                    ${data.message}
                </p>`;

            document
            .getElementById("resetPasswordForm")
            .reset();
        }else{

            messageDiv.innerHTML =
                `<p class="error">
                    ${
                        data.error ||
                        data.detail ||
                        data.non_field_errors ||
                        "Something went wrong"
                    }
                </p>`;
        }

    }catch(error){

        loader.style.display = "none";

        submitBtn.disabled = false;

        messageDiv.innerHTML =
            `<p class="error">
                Server Error
            </p>`;
    }

});
</script>

</body>
</html>
